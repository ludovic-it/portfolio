<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Schéma : déclenchement GitHub Actions</title>
  <desc id="desc">Du push sur le dépôt aux vérifications automatiques puis au résultat</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0969da"/>
    </marker>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f6f8fa"/>
      <stop offset="100%" style="stop-color:#eaeef2"/>
    </linearGradient>
  </defs>
  <rect width="720" height="240" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#24292f">GitHub Actions (vue simplifiée)</text>
  <rect x="32" y="88" width="140" height="72" rx="10" fill="url(#box)" stroke="#d0d7de" stroke-width="2"/>
  <text x="102" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#24292f">Code poussé</text>
  <text x="102" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a">push / PR</text>
  <line x1="172" y1="124" x2="238" y2="124" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="248" y="88" width="160" height="72" rx="10" fill="url(#box)" stroke="#0969da" stroke-width="2"/>
  <text x="328" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0969da">Workflow</text>
  <text x="328" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a">fichier YAML</text>
  <line x1="408" y1="124" x2="474" y2="124" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="484" y="88" width="200" height="72" rx="10" fill="url(#box)" stroke="#d0d7de" stroke-width="2"/>
  <text x="584" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#24292f">Jobs (étapes)</text>
  <text x="584" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a">tests, build, scans&</text>
  <text x="360" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#57606a">À comparer avec linterface « Actions » dun dépôt GitHub et la doc officielle.</text>
</svg>
